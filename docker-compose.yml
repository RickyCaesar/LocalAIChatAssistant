services:
  backend:
    build: ./backend
    container_name: ai-chat-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend/.env:/app/.env:ro
      - ./backend/database.sqlite:/app/database/database.sqlite
      - ./backend/storage/app:/app/storage/app
      - ${HOME}:${HOME}:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=${VITE_API_URL:-}
    container_name: ai-chat-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend