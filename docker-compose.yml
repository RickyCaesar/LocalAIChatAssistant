services:
  backend:
    build: ./backend
    image: local-ai-chat-backend
    container_name: ai-chat-backend
    restart: unless-stopped
    depends_on:
      clamav:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./backend/.env:/app/.env:ro
      - ./backend/database.sqlite:/app/database/database.sqlite
      - ./backend/storage/app:/app/storage/app
      - ${HOME}/.hermes:${HOME}/.hermes:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/api/health') ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  queue-worker:
    image: local-ai-chat-backend
    container_name: ai-chat-queue-worker
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --timeout=3600 --sleep=3
    volumes:
      - ./backend/.env:/app/.env:ro
      - ./backend/database.sqlite:/app/database/database.sqlite
      - ./backend/storage/app:/app/storage/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      clamav:
        condition: service_started
      backend:
        condition: service_healthy

  clamav:
    image: clamav/clamav:latest
    container_name: local-ai-clamav
    restart: unless-stopped
    mem_limit: 2g
    volumes:
      - clamav_data:/var/lib/clamav

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=${VITE_API_URL:-}
    container_name: ai-chat-frontend
    restart: unless-stopped
    ports:
      - "5173:80"   # HTTP (desktop)
      - "5174:443"  # HTTPS untuk HP: mikrofon butuh secure context
    volumes:
      - ./certs:/certs-host:ro   # sertifikat mkcert opsional, lihat README
    depends_on:
      - backend

volumes:
  clamav_data:
