# Satu origin untuk HTTP (desktop) dan HTTPS (HP): halaman HTTPS memanggil
# API lewat proxy /api ini (same-origin), jadi tak ada mixed content/CORS —
# dan mikrofon (butuh secure context) tersedia di HP.
server {
    listen 80;
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    # 497 = ada yang mengirim HTTP polos ke port HTTPS (mis. ketik "ip:5174"
    # tanpa https://) — arahkan otomatis, bukan balas 400 Bad Request.
    error_page 497 = https://$host:5174$request_uri;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 512m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # STT sinkron bisa berjalan bermenit-menit; jangan buffer respons dan
        # jangan menyerah sebelum job panjang selesai.
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss image/svg+xml;
}
